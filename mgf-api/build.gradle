import dev.mgf.build.ApiSignatureTask

plugins {
    id "java-library"
    id "maven-publish"
}

base {
    archivesName = "mgf-api"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

// mgf-api is intentionally dependency-free: no Minecraft, no LWJGL, no loader types.
// Consumers talk to the runtime through opaque handles (long) and plain Java types.

dependencies {
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "mgf-api"
            from components.java
        }
    }
    repositories {
        maven {
            name = "staging"
            url = rootProject.layout.buildDirectory.dir("repository")
        }
    }
}

tasks.named("jar") {
    from(project.file("LICENSE")) {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.register("apiSignature", ApiSignatureTask) {
    dependsOn tasks.named("jar")
    apiJar.set(tasks.named("jar").flatMap { it.archiveFile })
    signatureFile.set(layout.buildDirectory.file("reports/api-signature.txt"))
}

tasks.register("apiCompatibilityCheck", ApiSignatureTask) {
    dependsOn tasks.named("jar")
    apiJar.set(tasks.named("jar").flatMap { it.archiveFile })
    baselineFile.set(layout.projectDirectory.file("api-signature.txt"))
    signatureFile.set(layout.buildDirectory.file("reports/api-signature-check.txt"))
    compareWithBaseline.set(true)
}

tasks.named("check") {
    dependsOn tasks.named("apiCompatibilityCheck")
}
