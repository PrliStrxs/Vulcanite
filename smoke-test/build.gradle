plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

base {
    archivesName = "mgf-smoke"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

// Which backend this smoke run expects: -PsmokeBackend=vulkan (default) or opengl.
def smokeBackend = providers.gradleProperty("smokeBackend").getOrElse("vulkan")
def smokeValidationProperty = providers.gradleProperty("smokeValidation")
def smokeValidation = smokeValidationProperty.isPresent()
        && !smokeValidationProperty.get().equalsIgnoreCase("false")
def smokeProvidersProperty = providers.gradleProperty("smokeProviders")
def smokeProviders = smokeProvidersProperty.isPresent()
        && !smokeProvidersProperty.get().equalsIgnoreCase("false")
def smokeProviderMode = providers.gradleProperty("smokeProviderMode")
        .getOrElse(smokeProviders ? "noop" : "off")
def smokeProvidersEnabled = !smokeProviderMode.equalsIgnoreCase("off")

loom {
    runs {
        client {
            vmArg "-Dmgf.smoke.expectedBackend=${smokeBackend}"
            vmArg "-Dmgf.smoke.validation=${smokeValidation}"
            vmArg "-Dmgf.smoke.providers=${smokeProvidersEnabled}"
            vmArg "-Dmgf.smoke.providerMode=${smokeProviderMode}"
            vmArg "-Dmgf.sample.diagnosticProviders=${smokeProvidersEnabled}"
            vmArg "-Dmgf.sample.providerMode=${smokeProviderMode}"
            // Forces the backend regardless of options.txt and of vanilla's
            // crash watchdog (which resets the option after an "unexpected
            // shutdown" — and our harness stopping at CLIENT_STARTED counts
            // as one). Log line: "Graphics backend forced to {} by launch
            // argument, in-game preferred graphics backend setting is ignored".
            programArg "--graphicsBackend"
            programArg smokeBackend
            if (smokeValidation && smokeBackend.equalsIgnoreCase("vulkan")) {
                programArg "--vulkanValidation"
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation project(":mgf-api")
    implementation project(":mgf-impl-26.2")
    // Sample joins the smoke runtime so its pipelines/probes are gated too.
    implementation project(":samples:sample-interop")

    // Step 3 of M1: -PwithSodium adds Sodium to the dev runtime for coexistence runs.
    if (project.hasProperty("withSodium")) {
        runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
    }
}

def runDir = file("run")
def resultFile = new File(runDir, "mgf-smoke-result.txt")
def shutdownResultFile = new File(runDir, "mgf-smoke-shutdown-result.txt")

// Clears the previous result before launching (backend selection is done via
// the --graphicsBackend launch argument above, immune to options.txt state).
tasks.register("prepareSmokeRun") {
    inputs.property "backend", smokeBackend
    inputs.property "validation", smokeValidation
    outputs.upToDateWhen { false }
    doLast {
        runDir.mkdirs()
        resultFile.delete()
        shutdownResultFile.delete()
        logger.lifecycle("Smoke run prepared: backend=${smokeBackend} providerMode=${smokeProviderMode}")
    }
}

tasks.named("runClient") {
    mustRunAfter "prepareSmokeRun"
}

// Full harness: prepare -> launch (mod asserts, writes result, stops client) -> verify.
tasks.register("smokeTest") {
    dependsOn "prepareSmokeRun", "runClient"
    doLast {
        if (!resultFile.exists()) {
            throw new GradleException("Smoke test produced no result file — the client likely crashed before CLIENT_STARTED. Check ${runDir}/logs/latest.log")
        }
        def lines = resultFile.readLines()
        logger.lifecycle("Smoke result:\n" + lines.join("\n"))
        if (lines.isEmpty() || lines[0] != "PASS") {
            throw new GradleException("Smoke test FAILED — see details above")
        }
        if (!shutdownResultFile.exists()) {
            throw new GradleException("Smoke test produced no shutdown result file")
        }
        def shutdownLines = shutdownResultFile.readLines()
        logger.lifecycle("Smoke shutdown result:\n" + shutdownLines.join("\n"))
        if (shutdownLines.isEmpty() || shutdownLines[0] != "PASS") {
            throw new GradleException("Smoke shutdown verification FAILED — see details above")
        }
        if (smokeValidation && smokeBackend.equalsIgnoreCase("vulkan")) {
            def logFile = new File(runDir, "logs/latest.log")
            if (!logFile.exists()) {
                throw new GradleException("Validation smoke produced no latest.log")
            }
            def logText = logFile.getText("UTF-8")
            if (!logText.contains("Enabling Vulkan validation layers")) {
                throw new GradleException("Khronos validation was requested but did not enable")
            }
            def validationFailures = logFile.readLines("UTF-8").findAll {
                it =~ /(?i)(VUID-|SYNC-HAZARD-|UNASSIGNED-|Validation Error|Validation Warning)/
            }
            if (!validationFailures.isEmpty()) {
                throw new GradleException("Vulkan validation reported ${validationFailures.size()} issue(s):\n"
                        + validationFailures.take(20).join("\n"))
            }
            logger.lifecycle("Vulkan validation enabled with no reported issues")
        }
    }
}
