plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

base {
    // This project builds the "mgf" mod jar players install for MC 26.2.
    archivesName = "mgf"
}

version = "${project.mod_version}+mc${project.minecraft_version}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

loom {
    accessWidenerPath = file("src/main/resources/mgf.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Compile-time only: Fabric Loader 0.19.3 bundles MixinExtras 0.5.4 at runtime.
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.4"

    // The stable API ships inside this jar (Loom wraps plain jars automatically).
    api project(":mgf-api")
    include project(":mgf-api")

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "mgf-fabric-26.2"
            from components.java
        }
    }
    repositories {
        maven {
            name = "staging"
            url = rootProject.layout.buildDirectory.dir("repository")
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named("jar") {
    // PolyForm Shield's Notices section requires shipping the terms with copies.
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
